services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citation_rag_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Citation RAG
      - APP_VERSION=0.1.0
      - API_V1_PREFIX=/api/v1
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - UPLOAD_DIR=data/uploads
      - PROCESSED_DIR=data/processed
      - MAX_UPLOAD_SIZE_BYTES=10485760
      - DEFAULT_CHUNK_SIZE=500
      - DEFAULT_CHUNK_OVERLAP=100
      - LOG_LEVEL=INFO
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_processed:/app/data/processed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  backend_uploads:
  backend_processed:

